version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    cooldown:
      default-days: 7
  - package-ecosystem: "gomod"
    directory: "/"
    multi-ecosystem-group: dependencies
    patterns: ["*"]
    cooldown:
      default-days: 7
